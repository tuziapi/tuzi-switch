[package]
name = "opentu-connector"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
tempfile = "3"
toml_edit = "0.22"
fs2 = "0.4"

[dev-dependencies]
