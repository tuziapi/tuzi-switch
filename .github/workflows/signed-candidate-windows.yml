name: Real signed Windows candidate upgrade
on:
  workflow_call:
    inputs:
      manual_transition:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  installed-candidate:
    if: github.repository == 'AiW520/tuzi-switch'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        installer: [nsis, msi]
        legacy: ${{ inputs.manual_transition && fromJSON('["1.6.0","1.6.1"]') || fromJSON('["none"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the approved immutable source pair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/AiW520/tuzi-switch/actions/runs/43699923173 > "$RUNNER_TEMP/base-run.json"
          gh api repos/AiW520/tuzi-switch/actions/runs/43689683759 > "$RUNNER_TEMP/target-run.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          for (const [file,sha] of [['base-run.json','5bfee5f39b0b370093081227c6e19883f21280a0'],['target-run.json','695f4e933d797b39f7a61aad7804800a01eddc96']]) {
            const r=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,file)));
            assert.equal(r.conclusion,'success'); assert.equal(r.head_sha,sha);
            assert.equal(r.path,'.github/workflows/unified-release.yml');
          }
          JS
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: ${{ runner.temp }}/signed-base
          repository: AiW520/tuzi-switch
          run-id: 43699923173
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: ${{ runner.temp }}/signed-target
          repository: AiW520/tuzi-switch
          run-id: 43689683759
          github-token: ${{ github.token }}
      - name: Download the immutable published manual-transition source
        if: inputs.manual_transition
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_VERSION: ${{ matrix.legacy }}
        run: |
          gh release download "v$LEGACY_VERSION" -R tuziapi/tuzi-switch --dir "$RUNNER_TEMP/signed-legacy" --pattern 'tuzi-assistant-windows-x64.exe' --pattern 'tuzi-assistant-windows-x64.msi' --pattern 'manifest-windows-x64.json'
      - name: Install browser control client only
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/tuzi-candidate-tools" --ignore-scripts --no-package-lock playwright-core@1.55.1
      - name: Exercise actual installed UI and official signatures
        shell: pwsh
        env:
          INSTALLER_TYPE: ${{ matrix.installer }}
          LEGACY_VERSION: ${{ matrix.legacy }}
          LEGACY_INSTALLER_DIR: ${{ inputs.manual_transition && format('{0}/signed-legacy', runner.temp) || '' }}
        run: |
          $env:PLAYWRIGHT_MODULE = Join-Path $env:RUNNER_TEMP 'tuzi-candidate-tools/node_modules/playwright-core'
          node scripts/signed-windows-upgrade.mjs (Join-Path $env:RUNNER_TEMP 'signed-base') (Join-Path $env:RUNNER_TEMP 'signed-target') (Join-Path $env:RUNNER_TEMP 'signed-windows-evidence') $env:INSTALLER_TYPE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload observed evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-installed-windows-${{ matrix.installer }}-from-${{ matrix.legacy }}
          path: |
            ${{ runner.temp }}/signed-windows-evidence/results.json
            ${{ runner.temp }}/signed-windows-evidence/*.png
          if-no-files-found: warn
