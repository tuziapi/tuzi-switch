name: Official updater signing preflight
run-name: "正式更新签名验证 · ${{ github.ref_name }}"

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      OFFICIAL_UPDATER_PRIVATE_KEY:
        required: false
      OFFICIAL_UPDATER_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'tuziapi/tuzi-switch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      TUZI_SWITCH_RELEASE_REPOSITORY: tuziapi/tuzi-switch
      VITE_RELEASE_REPOSITORY: tuziapi/tuzi-switch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - run: pnpm install --frozen-lockfile
      - name: Sign a synthetic probe and verify the existing official public key
        shell: bash
        env:
          OFFICIAL_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$OFFICIAL_UPDATER_KEY" ]]; then echo 'Missing official signing key'; exit 1; fi
          umask 077
          KEY_PATH="$(mktemp "$RUNNER_TEMP/tuzi-official-key.XXXXXX")"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s' "$OFFICIAL_UPDATER_KEY" > "$KEY_PATH"
          export TAURI_SIGNING_PRIVATE_KEY="$KEY_PATH"
          node scripts/updater-assets.mjs check-key
      - name: Verify packaging contracts using synthetic signatures
        run: node --test scripts/verify-updater-assets.mjs

  protected-test-runner:
    if: github.repository == 'AiW520/tuzi-switch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: official-updater-signing
    env:
      TUZI_SWITCH_RELEASE_REPOSITORY: tuziapi/tuzi-switch
      VITE_RELEASE_REPOSITORY: tuziapi/tuzi-switch
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Preserve the public key embedded in the official release
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const key=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')).plugins.updater.pubkey.trim();
          // Official source ca378b869422b18f7b11c72b735ee8990dfb6a8b.
          if(createHash('sha256').update(key).digest('hex')!=='4563ca397f2a4d652b21c046a659ff2149b7537278e70b564263d688164fa7f1')
            throw Error('Official public key changed; refusing to substitute a new trust root');
          JS
      - name: Verify the protected official key without publishing or exporting it
        shell: bash
        env:
          OFFICIAL_UPDATER_KEY: ${{ secrets.OFFICIAL_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.OFFICIAL_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$OFFICIAL_UPDATER_KEY" ]]; then echo 'Configure OFFICIAL_UPDATER_PRIVATE_KEY in the protected environment first'; exit 1; fi
          umask 077
          KEY_PATH="$(mktemp "$RUNNER_TEMP/tuzi-protected-official-key.XXXXXX")"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s' "$OFFICIAL_UPDATER_KEY" > "$KEY_PATH"
          export TAURI_SIGNING_PRIVATE_KEY="$KEY_PATH"
          node scripts/updater-assets.mjs check-key
