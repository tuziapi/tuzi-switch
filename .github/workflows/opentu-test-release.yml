name: OpenTu five-platform test installers
run-name: "OpenTu 1.6.3-beta.5 · ${{ github.sha }}"
on:
  push:
    branches: [codex/test-opentu-1117]
    paths-ignore:
      - 'docs/**'
      - 'packages/download-page/**'
      - '.github/workflows/publish-opentu-test-page.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opentu-test-installers
  cancel-in-progress: false
env:
  NODE_OPTIONS: --max-old-space-size=4096
  VITE_RELEASE_REPOSITORY: AiW520/tuzi-switch
  TUZI_SWITCH_RELEASE_REPOSITORY: AiW520/tuzi-switch
  CARGO_INCREMENTAL: '0'
jobs:
  verify:
    if: github.repository == 'AiW520/tuzi-switch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/test_prepare_claude_local_node.py
      - run: python3 scripts/check-preview-gateway.py
      - run: pnpm build:creative
      - run: pnpm typecheck
      - run: pnpm exec vitest run --maxWorkers=2 --minWorkers=1
      - run: pnpm test:creative
      - run: pnpm --filter @tuzi/download-page test
  installers:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: opentu-beta-${{ matrix.target }}
          cache-on-failure: true
      # rust-cache recursively prunes files from non-Cargo directories under
      # target, leaving sherpa-onnx-prebuilt/lib empty. Its build script only
      # checks directory existence. Rehydrate this generated cache before use.
      - name: Rehydrate native speech libraries after Cargo cache restore
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          cache = Path("src-tauri/target/sherpa-onnx-prebuilt")
          if cache.exists():
              shutil.rmtree(cache)
          PYTHON
          cargo clean --release --manifest-path src-tauri/Cargo.toml -p sherpa-onnx-sys
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libgtk-3-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:renderer
      - name: Native integration in the actual release feature set
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --features claude-desktop-local,opentu-preview --lib local_ -- --test-threads=1
      - name: Native gateway configuration and rollback
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --features claude-desktop-local,opentu-preview --lib claude_desktop_ -- --test-threads=1
      - name: Build isolated test installer
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: python3 scripts/build-claude-local-candidate.py --target ${{ matrix.target }} --opentu-preview --test-release
      - name: Verify and collect installer
        run: python3 scripts/collect-opentu-test-installer.py --target ${{ matrix.target }} --platform ${{ matrix.platform }}
      - name: Install and cold-start Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/qa/opentu-windows-install-smoke.ps1 -Installer opentu-test-artifacts/OpenTu-Preview-1.6.3-beta.5-windows-x64.exe -Output windows-installed-smoke.json
      - name: Upload Windows installation evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-smoke
          path: windows-installed-smoke.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: opentu-beta-${{ matrix.platform }}
          path: opentu-test-artifacts/*
          if-no-files-found: error
          retention-days: 30
