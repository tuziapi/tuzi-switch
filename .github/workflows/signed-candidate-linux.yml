name: Installed signed Linux candidate probe
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  installed-candidate:
    if: github.repository == 'AiW520/tuzi-switch'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: ${{ runner.temp }}/signed-base
          repository: AiW520/tuzi-switch
          run-id: 43680220045
          github-token: ${{ github.token }}
      - name: Verify unchanged official candidate bytes and signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/AiW520/tuzi-switch/actions/runs/43680220045 > "$RUNNER_TEMP/base-run.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {verifySignature} from './scripts/updater-assets.mjs';
          const dir=path.join(process.env.RUNNER_TEMP,'signed-base');
          const c=JSON.parse(fs.readFileSync(path.join(dir,'candidate.json')));
          const r=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'base-run.json')));
          assert.equal(r.conclusion,'success'); assert.equal(r.head_sha,c.commit);
          assert.equal(r.path,'.github/workflows/unified-release.yml');
          assert.equal(c.commit,'11b8e308ef77708df3526a7701d106fc04b15f57');
          assert.equal(c.repository,'AiW520/tuzi-switch'); assert.equal(c.releaseRepository,'tuziapi/tuzi-switch');
          assert.equal(c.runId,'43680220045'); assert.equal(c.tag,'v1.6.2');
          const key=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')).plugins.updater.pubkey;
          assert.equal(createHash('sha256').update(key.trim()).digest('hex'),c.publicKeySha256);
          for(const [name,digest] of Object.entries(c.files)) {
            assert.equal(path.basename(name),name);
            assert.equal(createHash('sha256').update(fs.readFileSync(path.join(dir,name))).digest('hex'),digest);
          }
          const file=path.join(dir,'tuzi-assistant-linux-x64.deb');
          verifySignature(fs.readFileSync(file),fs.readFileSync(file+'.sig','utf8'),key);
          JS
      - name: Install candidate and create offline disposable desktop user
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-0 webkit2gtk-driver libayatana-appindicator3-1 xvfb dbus-x11
          sudo dpkg -i "$RUNNER_TEMP/signed-base/tuzi-assistant-linux-x64.deb"
          test -x /usr/bin/tu-zi-switch
          sudo useradd --create-home --shell /bin/bash tuziqa
          test ! -e /tmp/tuzi-signed-linux-probe
          sudo install -d -o tuziqa -g tuziqa /tmp/tuzi-signed-linux-probe /tmp/tuzi-signed-linux-probe/evidence
          sudo install -d -m 0700 -o tuziqa -g tuziqa /tmp/tuzi-signed-linux-probe/runtime
          sudo install -m 0644 scripts/signed-linux-driver-probe.py /tmp/tuzi-signed-linux-probe/probe.py
          sudo iptables -I OUTPUT 1 -m owner --uid-owner tuziqa ! -d 127.0.0.0/8 -j REJECT
          sudo ip6tables -I OUTPUT 1 -m owner --uid-owner tuziqa ! -d ::1 -j REJECT
      - name: Read actual installed WebKit UI and native identity
        run: |
          cd /tmp/tuzi-signed-linux-probe
          sudo -H -u tuziqa env -u DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR=/tmp/tuzi-signed-linux-probe/runtime \
            GITHUB_ACTIONS=true GITHUB_REPOSITORY=AiW520/tuzi-switch RUNNER_ENVIRONMENT=github-hosted \
            xvfb-run -a dbus-run-session -- python3 /tmp/tuzi-signed-linux-probe/probe.py \
            /usr/bin/tu-zi-switch /tmp/tuzi-signed-linux-probe/evidence
      - name: Stop disposable applications and restore network rules
        if: always()
        run: |
          if id tuziqa >/dev/null 2>&1; then
            sudo pkill -u tuziqa || true
            sudo iptables -D OUTPUT -m owner --uid-owner tuziqa ! -d 127.0.0.0/8 -j REJECT || true
            sudo ip6tables -D OUTPUT -m owner --uid-owner tuziqa ! -d ::1 -j REJECT || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-installed-linux-driver-probe
          path: |
            /tmp/tuzi-signed-linux-probe/evidence/results.json
            /tmp/tuzi-signed-linux-probe/evidence/driver.log
            /tmp/tuzi-signed-linux-probe/evidence/*.png
          if-no-files-found: warn
