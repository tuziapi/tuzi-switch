name: Build & Release
run-name: "release: ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read

env:
  PNPM_VERSION: "9"
  NODE_VERSION: "20"

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Check release signing mode
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured; publishing installers without updater artifacts."
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is configured; updater artifacts will be generated."
          fi
  build-macos-arm:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: Prepare updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/tauri-updater.key"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            pnpm tauri build --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            pnpm tauri build --target aarch64-apple-darwin
          fi
      - name: Collect assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle"
          DMG="$(find "$BUNDLE/dmg" -name "*.dmg" -print -quit)"
          test -n "$DMG"
          cp "$DMG" "release-assets/tuzi-switch-macos-aarch64.dmg"
          UPDATE="$(find "$BUNDLE/macos" -name "*.tar.gz" -print -quit 2>/dev/null || true)"
          if [[ -n "${UPDATE:-}" ]]; then
            cp "$UPDATE" "release-assets/tuzi-switch-macos-aarch64.app.tar.gz"
            if [[ -f "$UPDATE.sig" ]]; then
              cp "$UPDATE.sig" "release-assets/tuzi-switch-macos-aarch64.app.tar.gz.sig"
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm-release-assets
          path: release-assets/*
          if-no-files-found: error

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: Prepare updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/tauri-updater.key"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            pnpm tauri build --config '{"productName":"tuzi switch","bundle":{"createUpdaterArtifacts":false}}'
          else
            pnpm tauri build --config '{"productName":"tuzi switch"}'
          fi
      - name: Collect assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $bundle = "src-tauri/target/release/bundle"
          $msi = Get-ChildItem "$bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI installer not found" }
          Copy-Item $msi.FullName "release-assets/tuzi-switch-windows-x86_64.msi"
          $msiUpdate = Get-ChildItem "$bundle/msi/*.msi.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msiUpdate -and (Test-Path "$($msiUpdate.FullName).sig")) {
            Copy-Item $msiUpdate.FullName "release-assets/tuzi-switch-windows-x86_64.msi.zip"
            Copy-Item "$($msiUpdate.FullName).sig" "release-assets/tuzi-switch-windows-x86_64.msi.zip.sig"
          } elseif (Test-Path "$($msi.FullName).sig") {
            Copy-Item "$($msi.FullName).sig" "release-assets/tuzi-switch-windows-x86_64.msi.sig"
          }
          $setup = Get-ChildItem "$bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName "release-assets/tuzi-switch-windows-x86_64-setup.exe"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets/*
          if-no-files-found: error

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: Prepare updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/tauri-updater.key"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            pnpm tauri build
          fi
      - name: Collect assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          BUNDLE="src-tauri/target/release/bundle"
          APPIMAGE="$(find "$BUNDLE/appimage" -name "*.AppImage" -print -quit)"
          test -n "$APPIMAGE"
          cp "$APPIMAGE" "release-assets/tuzi-switch-linux-x86_64.AppImage"
          if [[ -f "$APPIMAGE.sig" ]]; then
            cp "$APPIMAGE.sig" "release-assets/tuzi-switch-linux-x86_64.AppImage.sig"
          fi
          DEB="$(find "$BUNDLE/deb" -name "*.deb" -print -quit || true)"
          RPM="$(find "$BUNDLE/rpm" -name "*.rpm" -print -quit || true)"
          if [[ -n "${DEB:-}" ]]; then cp "$DEB" "release-assets/tuzi-switch-linux-x86_64.deb"; fi
          if [[ -n "${RPM:-}" ]]; then cp "$RPM" "release-assets/tuzi-switch-linux-x86_64.rpm"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    needs: [create-release, build-macos-arm, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Validate assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "tuzi-switch-macos-aarch64.dmg"
            "tuzi-switch-windows-x86_64.msi"
            "tuzi-switch-linux-x86_64.AppImage"
          )
          for file in "${required[@]}"; do
            test -f "dist/$file" || { echo "Missing release asset: $file" >&2; exit 1; }
          done
      - name: Create or update draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          ## 安装方式

          ### macOS / Linux 一键安装

          \`\`\`bash
          curl -fsSL https://cdn.jsdelivr.net/gh/tuziapi/tuzi-switch@${TAG}/scripts/install_tuzi_switch.sh | bash
          \`\`\`

          或指定版本：

          \`\`\`bash
          curl -fsSL https://cdn.jsdelivr.net/gh/tuziapi/tuzi-switch@${TAG}/scripts/install_tuzi_switch.sh | TUZI_SWITCH_TAG=${TAG} bash
          \`\`\`

          ### Windows

          下载下方 Assets 中的 \`.msi\` 安装包，双击安装即可。
          EOF
          sed -i 's/^          //' "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "兔子switch $TAG" \
              --notes-file "$NOTES_FILE" \
              --draft
          else
            gh release create "$TAG" \
              --title "兔子switch $TAG" \
              --notes-file "$NOTES_FILE" \
              --draft \
              --latest=false
          fi
      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        shell: bash
        run: |
          gh release upload "$TAG" dist/* scripts/install_tuzi_switch.sh --clobber
      - name: Generate latest.json
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const tag = process.env.TAG;
          const version = tag.replace(/^v/, "");
          const baseUrl = `https://github.com/tuziapi/tuzi-switch/releases/download/${tag}`;
          const hasSignature = (name) => fs.existsSync(`dist/${name}.sig`);
          const signature = (name) => fs.readFileSync(`dist/${name}.sig`, "utf8").trim();
          const platforms = {};

          if (fs.existsSync("dist/tuzi-switch-macos-aarch64.app.tar.gz") && hasSignature("tuzi-switch-macos-aarch64.app.tar.gz")) {
            platforms["darwin-aarch64"] = {
              signature: signature("tuzi-switch-macos-aarch64.app.tar.gz"),
              url: `${baseUrl}/tuzi-switch-macos-aarch64.app.tar.gz`,
            };
          }
          if (fs.existsSync("dist/tuzi-switch-windows-x86_64.msi.zip") && hasSignature("tuzi-switch-windows-x86_64.msi.zip")) {
            platforms["windows-x86_64"] = {
              signature: signature("tuzi-switch-windows-x86_64.msi.zip"),
              url: `${baseUrl}/tuzi-switch-windows-x86_64.msi.zip`,
            };
          } else if (fs.existsSync("dist/tuzi-switch-windows-x86_64.msi") && hasSignature("tuzi-switch-windows-x86_64.msi")) {
            platforms["windows-x86_64"] = {
              signature: signature("tuzi-switch-windows-x86_64.msi"),
              url: `${baseUrl}/tuzi-switch-windows-x86_64.msi`,
            };
          }
          if (fs.existsSync("dist/tuzi-switch-linux-x86_64.AppImage") && hasSignature("tuzi-switch-linux-x86_64.AppImage")) {
            platforms["linux-x86_64"] = {
              signature: signature("tuzi-switch-linux-x86_64.AppImage"),
              url: `${baseUrl}/tuzi-switch-linux-x86_64.AppImage`,
            };
          }
          if (Object.keys(platforms).length === 0) {
            console.log("No updater signatures found; skipping latest.json generation.");
            process.exit(0);
          }

          const manifest = {
            version,
            notes: `兔子switch ${tag}`,
            pub_date: new Date().toISOString(),
            platforms,
          };

          fs.writeFileSync("latest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f latest.json ]; then
            gh release upload "$TAG" latest.json --clobber
          fi
          gh release edit "$TAG" \
            --draft=false \
            --prerelease=false \
            --latest
      - name: Publish manifest branch
        if: hashFiles('latest.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          WORKTREE="$(mktemp -d)"
          git clone --branch release-manifest --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORKTREE"
          cp latest.json "$WORKTREE/latest.json"
          cd "$WORKTREE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "发布更新清单 ${{ needs.create-release.outputs.tag }}"
          git push origin release-manifest
      - name: Purge jsDelivr cache
        if: hashFiles('latest.json') != ''
        shell: bash
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/tuziapi/tuzi-switch@release-manifest/latest.json" || true
          curl -fsS "https://purge.jsdelivr.net/gh/tuziapi/tuzi-switch@${{ needs.create-release.outputs.tag }}/scripts/install_tuzi_switch.sh" || true

  publish-web:
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Install minisign
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Build web assets
        id: build-web-assets
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
          WEB_UPDATE_MINISIGN_PRIVATE_KEY: ${{ secrets.WEB_UPDATE_MINISIGN_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WEB_UPDATE_MINISIGN_PRIVATE_KEY}" ]; then
            echo "WEB_UPDATE_MINISIGN_PRIVATE_KEY is not configured; skipping web hot update publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          pnpm run build:renderer
          mkdir -p web-release
          ARCHIVE="web-release/web.tar.gz"
          tar --sort=name --mtime="@0" --owner=0 --group=0 --numeric-owner -czf "$ARCHIVE" -C dist .
          export SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          export VERSION="${TAG#v}-web.1"
          export APP_VERSION="${TAG#v}"
          export APP_VERSION_RANGE=">=${APP_VERSION} <$(node -e 'const parts=process.env.APP_VERSION.split("-")[0].split(".").map((part)=>Number(part)||0); console.log(`${parts[0]}.${parts[1]+1}.0`)')"
          printf '%s\n' "$SHA256" "$VERSION" "$APP_VERSION_RANGE" > web-release/signature-payload.txt
          printf '%s\n' "$WEB_UPDATE_MINISIGN_PRIVATE_KEY" > web-release/minisign.key
          chmod 600 web-release/minisign.key
          minisign -Sm web-release/signature-payload.txt -s web-release/minisign.key -x "$ARCHIVE.sig" -W
          export SIGNATURE="$(base64 -w0 "$ARCHIVE.sig")"
          node <<'NODE'
          const fs = require("fs");
          const tag = process.env.TAG;
          const version = process.env.VERSION;
          const appVersionRange = process.env.APP_VERSION_RANGE;
          const sha256 = process.env.SHA256;
          const signature = process.env.SIGNATURE;
          const manifest = {
            version,
            appVersionRange,
            requiredCapabilities: {
              "terminal.launchProvider": ">=1.0.0",
              "terminal.launchCommand": ">=1.0.0",
              "config.getAppConfigInfo": ">=1.0.0",
              "analytics.trackProductEvent": ">=1.0.0",
              "update.getWebStatus": ">=1.0.0",
              "update.checkWeb": ">=1.0.0",
            },
            pubDate: new Date().toISOString(),
            archive: {
              url: `https://cdn.jsdelivr.net/gh/tuziapi/tuzi-switch@release-web/versions/${tag}/web.tar.gz`,
              sha256,
              signature,
            },
          };
          fs.writeFileSync("web-release/latest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - name: Publish web assets branch
        if: steps.build-web-assets.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          WORKTREE="$(mktemp -d)"
          mkdir -p "$WORKTREE/versions/${TAG}"
          cp web-release/web.tar.gz "$WORKTREE/versions/${TAG}/web.tar.gz"
          cp web-release/web.tar.gz.sig "$WORKTREE/versions/${TAG}/web.tar.gz.sig"
          sha256sum web-release/web.tar.gz | awk '{print $1}' > "$WORKTREE/versions/${TAG}/web.tar.gz.sha256"
          cp web-release/latest.json "$WORKTREE/latest.json"
          cd "$WORKTREE"
          git init
          git checkout --orphan release-web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json versions
          git commit -m "发布前端资源 ${TAG}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:release-web --force
      - name: Purge web jsDelivr cache
        if: steps.build-web-assets.outputs.skip != 'true'
        shell: bash
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/tuziapi/tuzi-switch@release-web/latest.json" || true
          curl -fsS "https://purge.jsdelivr.net/gh/tuziapi/tuzi-switch@release-web/versions/${{ needs.create-release.outputs.tag }}/web.tar.gz" || true
          curl -fsS "https://purge.jsdelivr.net/gh/tuziapi/tuzi-switch@release-web/versions/${{ needs.create-release.outputs.tag }}/web.tar.gz.sig" || true
          curl -fsS "https://purge.jsdelivr.net/gh/tuziapi/tuzi-switch@release-web/versions/${{ needs.create-release.outputs.tag }}/web.tar.gz.sha256" || true
