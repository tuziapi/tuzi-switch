name: Unified desktop release
run-name: "兔子助手 · ${{ github.ref_name }}"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows_msi_packaging_probe_only:
        description: Diagnose MSI packaging with a synthetic executable; no application build, signing or publication
        type: boolean
        default: false
      official_candidate:
        description: Build official-channel candidates on the protected test executor; never publish
        type: boolean
        default: false
      native_upgrade_lab_only:
        description: Run isolated native upgrade tests in the test repository; never publish
        type: boolean
        default: false
      native_upgrade_windows_only:
        description: Limit the isolated native laboratory to Windows
        type: boolean
        default: false
      windows_environment_probe_only:
        description: Only diagnose the Windows NSIS restart environment; no signing or release
        type: boolean
        default: false
      native_upgrade_packages_only:
        description: Test MSI, DEB and RPM with their actual package managers; never publish
        type: boolean
        default: false
      signing_preflight_only:
        description: Only verify the official signing key; do not build or publish
        type: boolean
        default: false
      native_upgrade_rpm_only:
        description: Limit the native laboratory to the Fedora RPM installer
        type: boolean
        default: false
      signed_candidate_windows_manual_transition:
        description: Include published 1.6.0 and 1.6.1 manual transitions before the signed Windows upgrade
        type: boolean
        default: false
      signed_candidate_macos_probe_only:
        description: Test unchanged signed Mac UI and automatic upgrades in disposable hosted runners; never publish
        type: boolean
        default: false
      signed_candidate_linux_probe_only:
        description: Test signed Linux candidate UI and package upgrades in offline disposable users; never publish
        type: boolean
        default: false
      signed_candidate_windows_only:
        description: Test approved 1.6.2 to 1.6.3 signed installer bytes in disposable Windows sessions; never publish
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: unified-release-${{ inputs.windows_msi_packaging_probe_only && 'windows-msi-probe' || inputs.signed_candidate_macos_probe_only && 'signed-macos-probe' || inputs.signed_candidate_linux_probe_only && 'signed-linux-probe' || inputs.signed_candidate_windows_only && 'signed-windows' || inputs.native_upgrade_lab_only && (inputs.native_upgrade_packages_only && 'native-packages' || 'native-lab') || inputs.signing_preflight_only && 'signing-preflight' || 'candidate' }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  # Creative workspace exceeds the 2 GiB heap default on macOS runners.
  NODE_OPTIONS: --max-old-space-size=4096
  TUZI_SWITCH_RELEASE_REPOSITORY: ${{ inputs.official_candidate && 'tuziapi/tuzi-switch' || github.repository }}
  VITE_RELEASE_REPOSITORY: ${{ inputs.official_candidate && 'tuziapi/tuzi-switch' || github.repository }}
  TUZI_OFFICIAL_TEST_CANDIDATE: ${{ inputs.official_candidate && '1' || '0' }}

jobs:
  windows-msi-packaging-probe:
    if: inputs.windows_msi_packaging_probe_only && github.repository == 'AiW520/tuzi-switch'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned bundler
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/tuzi-msi-tools" --ignore-scripts --no-package-lock @tauri-apps/cli@2.10.1
      - name: Reproduce MSI packaging with synthetic application bytes
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/probe-windows-msi.py "$RUNNER_TEMP/tuzi-msi-tools/node_modules/@tauri-apps/cli/tauri.js" 2>&1 | tee "$RUNNER_TEMP/msi-probe.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-msi-packaging-diagnostics
          path: |
            ${{ runner.temp }}/msi-probe.log
            src-tauri/target/x86_64-pc-windows-msvc/release/wix/x64/main.wxs
          if-no-files-found: warn

  signed-candidate-macos:
    if: inputs.signed_candidate_macos_probe_only && github.repository == 'AiW520/tuzi-switch'
    uses: ./.github/workflows/signed-candidate-macos.yml
    permissions:
      contents: read
      actions: read

  signed-candidate-linux:
    if: inputs.signed_candidate_linux_probe_only && !inputs.signed_candidate_macos_probe_only && github.repository == 'AiW520/tuzi-switch'
    uses: ./.github/workflows/signed-candidate-linux.yml
    permissions:
      contents: read
      actions: read

  signed-candidate-windows:
    if: inputs.signed_candidate_windows_only && !inputs.signed_candidate_linux_probe_only && !inputs.signed_candidate_macos_probe_only && github.repository == 'AiW520/tuzi-switch'
    uses: ./.github/workflows/signed-candidate-windows.yml
    with:
      manual_transition: ${{ inputs.signed_candidate_windows_manual_transition || false }}
    permissions:
      contents: read
      actions: read

  native-upgrade-lab:
    if: inputs.native_upgrade_lab_only && !inputs.signed_candidate_windows_only && !inputs.signed_candidate_linux_probe_only && !inputs.signed_candidate_macos_probe_only && github.repository == 'AiW520/tuzi-switch'
    uses: ./.github/workflows/native-upgrade-lab.yml
    with:
      windows_only: ${{ inputs.native_upgrade_windows_only || false }}
      windows_environment_probe_only: ${{ inputs.windows_environment_probe_only || false }}
      package_installers_only: ${{ inputs.native_upgrade_packages_only || false }}
      rpm_only: ${{ inputs.native_upgrade_rpm_only || false }}

  signing-preflight:
    if: inputs.signing_preflight_only && !inputs.native_upgrade_lab_only && !inputs.signed_candidate_windows_only && !inputs.signed_candidate_linux_probe_only && !inputs.signed_candidate_macos_probe_only && (github.repository == 'tuziapi/tuzi-switch' || github.repository == 'AiW520/tuzi-switch')
    uses: ./.github/workflows/channel-updater-preflight.yml
    secrets:
      UPDATER_KEY: ${{ github.repository == 'tuziapi/tuzi-switch' && secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TUZI_UPDATER_PRIVATE_KEY }}
      UPDATER_PASSWORD: ${{ inputs.official_candidate && secrets.OFFICIAL_UPDATER_PRIVATE_KEY_PASSWORD || (github.repository == 'tuziapi/tuzi-switch' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '') }}

  verify:
    if: ${{ !inputs.windows_msi_packaging_probe_only && !inputs.signing_preflight_only && !inputs.native_upgrade_lab_only && !inputs.signed_candidate_windows_only && !inputs.signed_candidate_linux_probe_only && !inputs.signed_candidate_macos_probe_only && (github.repository == 'tuziapi/tuzi-switch' || github.repository == 'AiW520/tuzi-switch') }}
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate protected executor mode
        if: inputs.official_candidate
        run: |
          test "$GITHUB_REPOSITORY" = 'AiW520/tuzi-switch'
          test "$GITHUB_REF" = 'refs/heads/codex/verified-desktop-updates'
      - name: Verify version identity
        id: identity
        env:
          PUBLISH: "false"
        run: node scripts/verify-release-identity.mjs
      - name: Require the existing channel signing key
        if: ${{ !inputs.official_candidate }}
        shell: bash
        env:
          OFFICIAL_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TEST_UPDATER_KEY: ${{ secrets.TUZI_UPDATER_PRIVATE_KEY }}
          PROTECTED_UPDATER_KEY: ${{ secrets.OFFICIAL_UPDATER_PRIVATE_KEY }}
        run: |
          if [[ "$TUZI_OFFICIAL_TEST_CANDIDATE" == 1 ]]; then UPDATER_KEY="$PROTECTED_UPDATER_KEY"; elif [[ "$GITHUB_REPOSITORY" == 'tuziapi/tuzi-switch' ]]; then UPDATER_KEY="$OFFICIAL_UPDATER_KEY"; else UPDATER_KEY="$TEST_UPDATER_KEY"; fi
          if [[ -z "$UPDATER_KEY" ]]; then echo 'Missing channel signing key; refusing unsigned build'; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/tauri-compatibility.mjs
      - run: pnpm build:creative
      - run: pnpm --filter @tuzi/download-page test
      - name: Compile download page before building installers
        run: pnpm --filter @tuzi/download-page exec vite build
      - uses: actions/upload-artifact@v4
        with:
          name: download-page-template
          path: packages/download-page/dist
          if-no-files-found: error
          retention-days: 30
      - run: python3 scripts/test_release_assets.py
      - run: python3 scripts/test_windows_branding.py
      - run: python3 scripts/test_prepare_windows_msi.py
      - run: python3 scripts/test_prepare_claude_local_node.py
      - run: python3 scripts/check-preview-gateway.py
      - run: node --test scripts/verify-updater-assets.mjs scripts/verify-update-acceptance.mjs scripts/verify-tauri-compatibility.mjs scripts/test-signed-candidate-pair.mjs
      - run: pnpm typecheck
      - run: pnpm exec vitest run --maxWorkers=2 --minWorkers=1
      - run: pnpm test:creative
      - run: python3 -m unittest discover -s src-tauri/resources/builtin-skills/codex-image-render-fallback/scripts -p 'test_*.py'

  installers:
    needs: verify
    environment: ${{ inputs.official_candidate && 'official-updater-signing' || 'candidate-build' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev libgtk-3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - name: Read repository Rust version
        id: rust-version
        shell: bash
        run: |
          node -e 'const fs = require("fs"); const text = fs.readFileSync("rust-toolchain.toml", "utf8"); const version = text.match(/^channel\s*=\s*"([^"]+)"/m)?.[1]; if (!version) throw new Error("Missing pinned Rust channel"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true
      - name: Rehydrate native speech libraries after Cargo cache restore
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          cache = Path("src-tauri/target/sherpa-onnx-prebuilt")
          if cache.exists():
              shutil.rmtree(cache)
          PYTHON
          cargo clean --release --manifest-path src-tauri/Cargo.toml -p sherpa-onnx-sys
      - run: pnpm install --frozen-lockfile
      - name: Prepare updater signing key
        shell: bash
        env:
          OFFICIAL_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TEST_UPDATER_KEY: ${{ secrets.TUZI_UPDATER_PRIVATE_KEY }}
          PROTECTED_UPDATER_KEY: ${{ secrets.OFFICIAL_UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ "$TUZI_OFFICIAL_TEST_CANDIDATE" == 1 ]]; then UPDATER_KEY="$PROTECTED_UPDATER_KEY"; elif [[ "$GITHUB_REPOSITORY" == 'tuziapi/tuzi-switch' ]]; then UPDATER_KEY="$OFFICIAL_UPDATER_KEY"; else UPDATER_KEY="$TEST_UPDATER_KEY"; fi
          if [[ -z "$UPDATER_KEY" ]]; then echo 'Missing channel signing key; refusing unsigned release'; exit 1; fi
          umask 077
          KEY_PATH="$RUNNER_TEMP/tuzi-updater.key"
          printf '%s' "$UPDATER_KEY" > "$KEY_PATH"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Verify signing key against channel public key
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.official_candidate && secrets.OFFICIAL_UPDATER_PRIVATE_KEY_PASSWORD || (github.repository == 'tuziapi/tuzi-switch' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '') }}
        run: node scripts/updater-assets.mjs check-key
      - run: pnpm build:renderer
      - name: Native regression (host target)
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --features claude-desktop-local --lib -- --test-threads=1
      - name: Isolated MCP service regression
        if: runner.os == 'macOS'
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --features claude-desktop-local --lib native_mcp_service_ -- --ignored --test-threads=1
      - name: Acceptance profile regression
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib --features claude-desktop-local,isolated-profile acceptance_profile_ -- --test-threads=1
      - name: Build installers
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: '-'
          BUILD_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.official_candidate && secrets.OFFICIAL_UPDATER_PRIVATE_KEY_PASSWORD || (github.repository == 'tuziapi/tuzi-switch' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '') }}
        run: |
          set -euo pipefail
          python3 scripts/build-claude-local-candidate.py --target "$BUILD_TARGET" --stable-release 2>&1 | tee "$RUNNER_TEMP/tuzi-bundle.log"
          if grep -Fq 'Failed to add bundler type' "$RUNNER_TEMP/tuzi-bundle.log"; then
            echo 'Installer type was not embedded; refusing an updater candidate with ambiguous package selection'
            exit 1
          fi
      - name: Verify packaged runtime and stable identity
        run: python3 scripts/verify-official-runtime.py --target ${{ matrix.target }}
      - name: Collect installers and source manifest
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_NAME: ${{ matrix.name }}
        run: |
          python3 <<'PY'
          import hashlib, json, os, pathlib, shutil
          source = pathlib.Path('src-tauri/target') / os.environ['BUILD_TARGET'] / 'release/bundle'
          output = pathlib.Path('release-assets')
          output.mkdir()
          files = []
          for path in sorted(source.rglob('*')):
              if path.is_file() and path.suffix in {'.dmg', '.msi', '.exe', '.AppImage', '.deb', '.rpm'}:
                  target = output / ('tuzi-assistant-' + os.environ['BUILD_NAME'] + path.suffix)
                  if target.exists(): raise SystemExit('Duplicate installer format')
                  shutil.copy2(path, target)
                  files.append({'file': target.name, 'sha256': hashlib.sha256(target.read_bytes()).hexdigest(), 'bytes': target.stat().st_size})
          if not files:
              raise SystemExit('No installers were produced')
          (output / ('manifest-' + os.environ['BUILD_NAME'] + '.json')).write_text(json.dumps({
              'repository': os.environ['GITHUB_REPOSITORY'], 'releaseRepository': os.environ['TUZI_SWITCH_RELEASE_REPOSITORY'], 'commit': os.environ['GITHUB_SHA'],
              'run': os.environ['GITHUB_RUN_ID'], 'target': os.environ['BUILD_TARGET'],
              'version': json.loads(pathlib.Path('package.json').read_text(encoding='utf-8'))['version'],
              'developerSigned': False, 'notarized': False, 'channel': 'stable',
              'applicationId': 'com.tuziswitch.desktop', 'isolatedLocalProfile': False, 'files': files
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Collect and verify signed updater artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.official_candidate && secrets.OFFICIAL_UPDATER_PRIVATE_KEY_PASSWORD || (github.repository == 'tuziapi/tuzi-switch' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '') }}
        run: node scripts/updater-assets.mjs collect "src-tauri/target/${{ matrix.target }}/release/bundle" release-assets "${{ matrix.name }}"
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/tuzi-updater.key"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  assemble:
    needs: [verify, installers]
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify every package against its build manifest
        run: python3 scripts/verify-release-assets.py release-assets
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify signatures and generate updater manifest
        run: node scripts/updater-assets.mjs manifest release-assets
      - name: Prepare release notes and source
        shell: bash
        run: |
          git archive --format=tar.gz --output=release-assets/tuzi-assistant-source.tar.gz HEAD
          cp "docs/releases/${RELEASE_TAG}.md" /tmp/release-notes.md
          cd release-assets
          sha256sum tuzi-assistant-* > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Bind all candidate files to this source and run
        run: node scripts/update-acceptance.mjs candidate release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
